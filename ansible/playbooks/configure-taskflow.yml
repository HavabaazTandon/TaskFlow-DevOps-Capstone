---
- name: Configure TaskFlow
  hosts: local
  become: true
  tasks:
    - name: Create TaskFlow configuration directory
      file:
        path: /opt/taskflow
        state: directory
        mode: '0755'

    - name: Configure application environment
      copy:
        dest: /opt/taskflow/app.env
        mode: '0640'
        content: |
          APP_ENV=production
          APP_PORT=5002
