---
- name: Install Docker
  hosts: local
  become: true
  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Docker and Compose
      apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present

    - name: Enable Docker service
      service:
        name: docker
        state: started
        enabled: true
