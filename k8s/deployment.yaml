apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow
spec:
  replicas: 3
  selector:
    matchLabels:
      app: taskflow
  template:
    metadata:
      labels:
        app: taskflow
    spec:
      serviceAccountName: taskflow-app
      automountServiceAccountToken: false
      containers:
        - name: taskflow
          image: taskflow-app:k8s-v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: taskflow-secret
                  key: SECRET_KEY
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: APP_ENV
            - name: FLASK_HOST
              value: "0.0.0.0"
            - name: LOG_DIR
              value: "/app/logs"
          volumeMounts:
            - name: taskflow-storage
              mountPath: /app/instance
          readinessProbe:
            httpGet:
              path: /login
              port: 5002
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: 5002
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: taskflow-storage
          persistentVolumeClaim:
            claimName: taskflow-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: taskflow-service
spec:
  type: NodePort
  selector:
    app: taskflow
  ports:
    - port: 5002
      targetPort: 5002
      nodePort: 30082
