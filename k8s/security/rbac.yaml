apiVersion: v1
kind: ServiceAccount
metadata:
  name: taskflow-app
  namespace: default
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: taskflow-observer
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: taskflow-observer
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: taskflow-observer
  namespace: default
subjects:
  - kind: ServiceAccount
    name: taskflow-observer
    namespace: default
roleRef:
  kind: Role
  name: taskflow-observer
  apiGroup: rbac.authorization.k8s.io
