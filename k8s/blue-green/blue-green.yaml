apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskflow
      version: blue
  template:
    metadata:
      labels:
        app: taskflow
        version: blue
    spec:
      serviceAccountName: taskflow-app
      automountServiceAccountToken: false
      containers:
        - name: taskflow
          image: taskflow-app:k8s
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: taskflow-secret
                  key: SECRET_KEY
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: APP_ENV
            - name: FLASK_HOST
              value: "0.0.0.0"
            - name: LOG_DIR
              value: "/app/logs"
          readinessProbe:
            httpGet:
              path: /login
              port: 5002
          livenessProbe:
            httpGet:
              path: /login
              port: 5002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-green
spec:
  replicas: 0
  selector:
    matchLabels:
      app: taskflow
      version: green
  template:
    metadata:
      labels:
        app: taskflow
        version: green
    spec:
      serviceAccountName: taskflow-app
      automountServiceAccountToken: false
      containers:
        - name: taskflow
          image: taskflow-app:k8s
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: taskflow-secret
                  key: SECRET_KEY
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: APP_ENV
            - name: FLASK_HOST
              value: "0.0.0.0"
            - name: LOG_DIR
              value: "/app/logs"
          readinessProbe:
            httpGet:
              path: /login
              port: 5002
          livenessProbe:
            httpGet:
              path: /login
              port: 5002
---
apiVersion: v1
kind: Service
metadata:
  name: taskflow-bluegreen
spec:
  type: NodePort
  selector:
    app: taskflow
    version: blue
  ports:
    - port: 5002
      targetPort: 5002
      nodePort: 30084
