
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: logging
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush                     5
        Daemon                    Off
        Log_Level                 info
        Parsers_File              parsers.conf

    [INPUT]
        Name                      tail
        Path                      /var/log/containers/*.log
        Parser                    cri
        Tag                       kube.*
        Refresh_Interval          5
        Mem_Buf_Limit             10MB
        Skip_Long_Lines           On
        DB                        /var/lib/fluent-bit/flb_kube.db

    [FILTER]
        Name                      kubernetes
        Match                     kube.*
        Kube_Tag_Prefix           kube.var.log.containers.
        Merge_Log                 On
        Keep_Log                  Off
        Labels                    Off
        Annotations               Off

    [OUTPUT]
        Name                      es
        Match                     kube.*
        Host                      host.minikube.internal
        Port                      9200
        Logstash_Format           On
        Logstash_Prefix           taskflow-k8s
        Suppress_Type_Name        On
        Generate_ID               On
        Retry_Limit               False
        Trace_Error               On

  parsers.conf: |
    [PARSER]
        Name                      cri
        Format                    regex
        Regex                     ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key                  time
        Time_Format               %Y-%m-%dT%H:%M:%S.%L%z
