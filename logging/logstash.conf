input {
  file {
    path => "/usr/share/logstash/pipeline/logs/*.jsonl"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => json
    tags => ["application"]
  }

  file {
    path => "/usr/share/logstash/pipeline/logs/kubernetes-taskflow*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => plain
    tags => ["kubernetes"]
  }

  file {
    path => "/usr/share/logstash/docker-logs/*.json"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => json
    tags => ["docker"]
  }
}

filter {
  if "docker" in [tags] {
    mutate {
      add_field => { "source_type" => "docker_container" }
    }
  } else if "kubernetes" in [tags] {
    mutate {
      add_field => { "source_type" => "kubernetes_pod" }
    }
  } else {
    mutate {
      add_field => { "source_type" => "application" }
    }
  }

  mutate {
    add_field => { "lab" => "TaskFlow DevOps Capstone" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "taskflow-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
